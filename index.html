let umbral=parseInt(localStorage.getItem('zf_umbral')||'30');
function save(){localStorage.setItem('zf_veh',JSON.stringify(vehiculos));localStorage.setItem('zf_clientes',JSON.stringify(clientes));localStorage.setItem('zf_umbral',umbral)}
function dias(v){let fin=v.desp?new Date(v.desp):new Date();let ini=new Date(v.ing);return Math.max(0,Math.round((fin-ini)/86400000))}
function filtro(){let cv=document.getElementById('clienteVista').value;return vehiculos.filter(v=>!cv||v.cliente==cv)}
function show(id,el){document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));el.classList.add('active');['dash','inv','cli'].forEach(x=>document.getElementById(x).style.display=x==id?'block':'none')}
function render(){
 let sel=document.getElementById('clienteVista');let cur=sel.value;sel.innerHTML='<option value="">Todos los clientes</option>'+clientes.map(c=>`<option ${c.nombre==cur?'selected':''}>${c.nombre}</option>`).join('');
 let list=filtro(),rol=document.getElementById('rol').value,ing=list.length,desp=list.filter(v=>v.desp).length,patio=ing-desp,pct=ing?Math.round(desp/ing*100):0;

 <div class="box"><b>⚙️ Umbral de alerta</b> <span>Si un vehículo supera estos días en patio entra en alerta.</span><div class="flex"><input id="um" type="number" value="${umbral}" style="width:120px"><button class="btn" onclick="umbral=parseInt(document.getElementById('um').value)||30;save();render()">Guardar umbral</button><button class="btnG" onclick="exportCSV()">⬇ Exportar Excel / CSV</button><button class="btnG" onclick="exportHTML()">⬇ Exportar Informe HTML</button></div></div>
 <div class="grid"><div class="box"><h3>Distribución por cliente</h3>${clientes.map(c=>{let n=list.filter(v=>v.cliente==c.nombre).length;return `<div>${c.nombre}: <b>${n}</b><div style="background:#eee;height:12px;border-radius:10px"><div style="width:${ing?n/ing*100:0}%;background:#0f2340;height:12px;border-radius:10px"></div></div></div>`}).join('')}</div>
 <div class="box"><h3>Días de permanencia por cliente</h3><table><tr><th>Cliente</th><th>Vehículos</th><th>Promedio</th><th>Máx</th></tr>${clientes.map(c=>{let a=list.filter(v=>v.cliente==c.nombre);if(!a.length)return '';let ds=a.map(dias);return `<tr><td>${c.nombre}</td><td>${a.length}</td><td>${(ds.reduce((x,y)=>x+y,0)/ds.length).toFixed(1)} días</td><td>${Math.max(...ds)} días</td></tr>`}).join('')}</table></div></div>
 <div class="box"><h3>🚨 Alertas de permanencia</h3>${alertas.length?alertas.sort((a,b)=>dias(b)-dias(a)).map(v=>`<div class="alert"><b>${v.cliente} - ${v.arin}</b> | VIN ${v.vin} | ${v.tipo} ${v.maq} | Ingreso ${v.ing} | <b>${dias(v)} días en patio</b> (${dias(v)-umbral} sobre umbral) | 📍 ${v.bahia} <span class="badge ${dias(v)>umbral+15?'crit':'warn'}">${dias(v)>umbral+15?'CRÍTICO':'ADVERTENCIA'}</span></div>`).join(''):'<p>✅ Sin alertas. Ningún vehículo supera el umbral.</p>'}</div>`;
 // Inventario
 let rows=list.map(v=>`<tr><td>${v.arin}</td><td>${v.cliente}</td><td>${v.vin}</td><td>${v.tipo}${v.maq?'<br><small>'+v.maq+'</small>':''}</td><td>${v.merc}</td><td>${v.comb}</td><td>${v.serv}</td><td>${v.ing}</td><td>${v.desp||'—'}</td><td><b>${dias(v)}</b> ${!v.desp&&dias(v)>umbral?`<span class="badge ${dias(v)>umbral+15?'crit':'warn'}">ALERTA</span>`:''}</td><td>📍 ${v.bahia}</td><td>${v.foto?`<img class="thumb" src="${v.foto}">`:'—'}</td><td><span class="badge ${v.desp?'desp':'patio'}">${v.desp?'Despachado':'En Patio'}</span></td><td>${rol!='Cliente'?`<button onclick="despachar(${v.id})">Despachar</button> <button onclick="eliminar(${v.id})">🗑</button>`:''}</td></tr>`).join('');

 <div><label>Servicio</label><select id="f_serv"><option>Alistamiento</option><option>Bodegaje</option><option>Ambos</option></select></div>

 </div><button class="btn" onclick="agregar()">Guardar ingreso</button>`}</div>
 <div class="box"><div class="flex"><input id="bus" placeholder="Buscar VIN / ARIN / Cliente" oninput="buscar(this.value)" style="max-width:320px"><button class="btnG" onclick="exportCSV()">Exportar CSV</button><button class="btnG" onclick="exportHTML()">Exportar HTML</button></div>

 document.getElementById('cli').innerHTML=`<div class="box"><h3>Clientes</h3>${clientes.map(c=>`<p><b>${c.nombre}</b> - NIT ${c.nit} - ${c.contacto}</p>`).join('')}${rol=='Administrador'?`<div class="flex"><input id="n_cli" placeholder="Nombre cliente" style="max-width:250px"><input id="n_nit" placeholder="NIT" style="max-width:150px"><button class="btn" onclick="clientes.push({nombre:document.getElementById('n_cli').value,nit:document.getElementById('n_nit').value,contacto:''});save();render()">Crear cliente</button></div><p><small>Solo Administrador puede crear clientes y usuarios.</small></p>`:''}</div><div class="box"><h3>Cómo usar</h3><p>1. Elige rol Administrador para crear clientes. 2. Operario registra ingresos. 3. Cuando sale un vehículo, usa Despachar y pon fecha de despacho. 4. Cliente solo ve y descarga informe. Los datos se guardan en este navegador.</p></div>`;
}
function agregar(){let v={id:Date.now(),cliente:document.getElementById('f_cliente').value,merc:document.getElementById('f_merc').value,arin:document.getElementById('f_arin').value||('ARIN-2026-'+Math.floor(Math.random()*900+100)),ing:document.getElementById('f_ing').value,vin:document.getElementById('f_vin').value,tipo:document.getElementById('f_tipo').value,maq:document.getElementById('f_maq')?.value||'',comb:document.getElementById('f_comb').value,serv:document.getElementById('f_serv').value,bahia:document.getElementById('f_bahia').value,foto:document.getElementById('f_foto').value,desp:'',obs:document.getElementById('f_obs').value};if(!v.vin||!v.ing){alert('Falta VIN o fecha');return}vehiculos.push(v);save();render();alert('Vehículo guardado')}
function despachar(id){let f=prompt('Fecha de despacho (AAAA-MM-DD)',new Date().toISOString().slice(0,10));if(!f)return;let v=vehiculos.find(x=>x.id==id);v.desp=f;save();render()}
function eliminar(id){if(!confirm('¿Eliminar?'))return;vehiculos=vehiculos.filter(x=>x.id!=id);save();render()}
function buscar(q){q=q.toLowerCase();document.querySelectorAll('#tbody tr').forEach(r=>{r.style.display=r.innerText.toLowerCase().includes(q)?'':'none'})}
function exportCSV(){let cliente=document.getElementById('clienteVista').value||'Todos';let veh=filtro();let aud=auditoria.filter(x=>!document.getElementById('clienteVista').value||x.cliente==document.getElementById('clienteVista').value);let vehRows=veh.map(v=>'<tr><td>'+v.arin+'</td><td>'+v.cliente+'</td><td>'+v.vin+'</td><td>'+v.tipo+' '+(v.maq||'')+'</td><td>'+v.merc+'</td><td>'+v.comb+'</td><td>'+v.serv+'</td><td>'+v.ing+'</td><td>'+(v.desp||'')+'</td><td>'+dias(v)+'</td><td>'+v.bahia+'</td><td>'+(v.desp?'Despachado':'En Patio')+'</td></tr>').join('');let audRows=aud.length?aud.map(a=>'<tr><td>'+a.fecha+'</td><td>'+a.usuario+'</td><td>'+a.rol+'</td><td>'+a.accion+'</td><td>'+a.arin+'</td><td>'+a.cliente+'</td><td>'+a.vin+'</td><td>'+a.detalle+'</td></tr>').join(''):'<tr><td colspan=8>Sin movimientos</td></tr>';let html='<html><head><meta charset="utf-8"></head><body><table><tr><td><img src="'+LOGO_ZF+'" width="180"></td><td><h1>TL - VMS - Informe de Vehículos</h1><p>Cliente: '+cliente+' | Generado: '+new Date().toLocaleString('es-CO')+' | Por: '+quien()+'</p></td><td><img src="'+LOGO_AW+'" width="220"></td></tr></table><h2>1. Vehículos</h2><table border=1><tr><th>ARIN</th><th>Cliente</th><th>VIN</th><th>Tipo</th><th>Mercancía</th><th>Combustible</th><th>Servicio</th><th>Ingreso</th><th>Despacho</th><th>Días</th><th>Bahía</th><th>Estado</th></tr>'+vehRows+'</table><h2>2. Auditoría / Historial</h2><table border=1><tr><th>Fecha</th><th>Quién</th><th>Rol</th><th>Acción</th><th>ARIN</th><th>Cliente</th><th>VIN</th><th>Detalle</th></tr>'+audRows+'</table></body></html>';let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'application/vnd.ms-excel'}));a.download='tl-vms-informe-'+(cliente||'todos')+'.xls';a.click();alert('Informe Excel descargado con logos + vehículos + auditoría (cliente: '+cliente+'). Ábrelo con Excel.');}
function exportHTML(){let w=window.open('','_blank');w.document.write('<div style="display:flex;justify-content:space-between;align-items:center"><img src="'+LOGO_ZF+'" style="height:60px"><h1>TL - VMS - Informe</h1><img src="'+LOGO_AW+'" style="height:60px"></div><p style="text-align:center">Zona Franca - Usuario Industrial de Servicios | TL - VMS | Access World</p>'<p>Generado '+new Date().toLocaleString()+'</p><table border=1>'+document.querySelector('#tbody').outerHTML+'</table>')}
